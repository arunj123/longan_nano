[workspace]
members = [
    "crates/gd32vf103-pac",
    "crates/gd32vf103-hal",
    "crates/longan-nano-bsp",
    "crates/lcd-font",
    "prj_blink",
    "prj_uart_test",
    "prj_lcd_test",
    "prj_sdcard_test",
    "prj_sdcard_fs_test",
    "prj_usb_serial",
    "prj_current_monitor",
    "prj_usb_composite",
    "prj_usb_msc",
]
resolver = "2"

[profile.dev]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1

[patch.crates-io]
embedded-sdmmc = { path = "crates/embedded-sdmmc" }

